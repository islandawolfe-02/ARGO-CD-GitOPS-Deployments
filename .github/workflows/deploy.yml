name: Record deployment request

on:
  workflow_dispatch:
    inputs:
      project:
        description: Registered project name
        type: string
        required: true
      source_repository:
        description: Application source owner/repository
        type: string
        required: true
      source_revision:
        description: Application source commit from the verified image
        type: string
        required: true
      image:
        description: Full public GHCR package reference pinned by digest
        type: string
        required: true
      namespace:
        description: Additional deployment namespace
        type: string
        required: true
      deployment_name:
        description: Installation name
        type: string
        required: true
      app_port:
        description: App port-forward port on the Mac
        type: string
        required: true
      grafana_port:
        description: Grafana port-forward port on the Mac
        type: string
        required: true
      loki_port:
        description: Loki port-forward port on the Mac
        type: string
        required: true
      lab_env:
        description: workshop-blue or workshop-green
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deployment-records
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Test rendering and ownership checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Validate request and render manifests
        id: render
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/render.py
      - uses: docker/setup-buildx-action@v4
      - name: Check public registry image and supported platforms
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > /tmp/deployment-index.json
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from render import validate_platforms

          validate_platforms(json.loads(Path('/tmp/deployment-index.json').read_text()))
          PY
      - name: Commit deployment configuration
        env:
          DEPLOYMENT_ID: ${{ steps.render.outputs.deployment_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- deployments/ bootstrap/
          if ! git diff --cached --quiet; then
            git commit -m "Update deployment $DEPLOYMENT_ID"
            git push origin HEAD:main
          fi
      - name: Show automatic registration and access commands
        env:
          DEPLOYMENT_ID: ${{ steps.render.outputs.deployment_id }}
          DEPLOYMENT_PATH: ${{ steps.render.outputs.path }}
        run: |
          {
            echo '### Deployment configuration recorded'
            echo "Deployment ID: $DEPLOYMENT_ID"
            echo 'The parent Argo Application cd-bootstrap registers this installation automatically after its ownership checks pass.'
            echo 'One-time setup on a new cluster: python3 scripts/parent.py --install (see README).'
            echo 'Run each port-forward command in a separate terminal.'
            echo '```bash'
            cat "$DEPLOYMENT_PATH/commands.txt"
            echo '```'
            echo 'Wait for the child Application to become Synced/Healthy and verify the Pods before recording deployment success.'
            echo 'This workflow records configuration; it does not contact the cluster or start Mac port-forwards.'
          } >> "$GITHUB_STEP_SUMMARY"
